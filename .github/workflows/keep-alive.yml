name: Keep Supabase Project Active

on:
  schedule:
    # Runs every 3 days at 09:00 UTC — safely under Supabase's 7-day limit
    - cron: '0 9 */3 * *'
  workflow_dispatch: # lets you trigger it manually from the GitHub Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets are set correctly
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL secret is empty or missing."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) echo "URL format looks correct." ;;
            *) echo "::error::VITE_SUPABASE_URL looks malformed. It should look exactly like https://xxxx.supabase.co with nothing extra before or after (no quotes, no trailing slash, no /rest/v1/)."; exit 1 ;;
          esac

      - name: Ping Supabase rooms table
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Supabase responded with an error code ($HTTP_CODE). Check that VITE_SUPABASE_ANON_KEY matches your project."
            exit 1
          fi
